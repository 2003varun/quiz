<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Quiz Buddy</title>
</head>

<body style="
margin:0;
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#667eea,#764ba2);
font-family:'Segoe UI',sans-serif;
">

<div style="
background:#fff;
width:700px;
max-width:95%;
padding:35px;
border-radius:20px;
box-shadow:0 25px 50px rgba(0,0,0,0.25);
">

<h2 style="
text-align:center;
margin-bottom:25px;
color:#333;
letter-spacing:1px;
">
🧠 Quiz Time
</h2>

<form method="post">

{% for q in questions %}
{% set qi = loop.index0 %}

<div style="margin-bottom:25px;">

<p style="
font-size:17px;
font-weight:600;
color:#333;
margin-bottom:12px;
">
{{ loop.index }}. {{ q[0] }}
</p>

{% for option in q[1:5] %}
<label style="
display:block;
padding:12px 15px;
margin-bottom:10px;
border-radius:12px;
border:1px solid #ddd;
cursor:pointer;
transition:0.3s;
">
<input type="radio"
       name="q{{ qi }}"
       value="{{ option }}"
       {% if loop.first %}required{% endif %}
       style="margin-right:10px;">
{{ option }}
</label>
{% endfor %}

</div>
{% endfor %}

<button style="
width:100%;
padding:14px;
border:none;
border-radius:14px;
font-size:17px;
font-weight:600;
cursor:pointer;
color:white;
background:linear-gradient(90deg,#667eea,#764ba2);
transition:0.3s;
">
🚀 Submit Quiz
</button>

</form>

</div>

</body>
</html>
