<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Create Account — Messimo</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --green-bg: #7bc67e;
      --green-dark: #5aaf5e;
      --green-btn: #4caf50;
      --white: #ffffff;
      --black: #111;
      --gray: #888;
      --input-border: #e0e0e0;
      --input-bg: #fafafa;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: #c8e6c9;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    /* outer shell — the rounded dark border seen in the screenshot */
    .shell {
      width: 820px;
      height: 500px;
      background: #2a2a2a;
      border-radius: 32px;
      padding: 10px;
      box-shadow: 0 32px 80px rgba(0,0,0,0.28);
      display: flex;
      animation: fadeUp 0.6s ease both;
    }

    @keyframes fadeUp {
      from { opacity:0; transform:translateY(20px); }
      to   { opacity:1; transform:translateY(0); }
    }

    /* ── LEFT: green illustration side ── */
    .left {
      flex: 1;
      border-radius: 22px 0 0 22px;
      background: linear-gradient(160deg, #a5d6a7 0%, #66bb6a 60%, #388e3c 100%);
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }

    /* floor */
    .left::after {
      content: '';
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 38%;
      background: #2e7d32;
      border-radius: 0 0 0 22px;
    }

    /* clock on wall */
    .clock {
      position: absolute;
      top: 28px; left: 50%;
      transform: translateX(-50%);
      width: 46px; height: 46px;
      background: white;
      border-radius: 50%;
      border: 3px solid #ccc;
      display: flex; align-items: center; justify-content: center;
      z-index: 2;
    }
    .clock::before { /* hour hand */
      content: '';
      position: absolute;
      bottom: 50%; left: 50%;
      width: 2px; height: 10px;
      background: #333;
      transform-origin: bottom center;
      transform: translateX(-50%) rotate(-30deg);
      border-radius: 2px;
    }
    .clock::after { /* minute hand */
      content: '';
      position: absolute;
      bottom: 50%; left: 50%;
      width: 1.5px; height: 13px;
      background: #555;
      transform-origin: bottom center;
      transform: translateX(-50%) rotate(60deg);
      border-radius: 2px;
    }

    /* 3D character SVG */
    .character {
      position: relative;
      z-index: 3;
      width: 230px;
      margin-bottom: 0;
      animation: float 5s ease-in-out infinite;
    }

    @keyframes float {
      0%,100% { transform: translateY(0); }
      50%      { transform: translateY(-8px); }
    }

    /* plant */
    .plant {
      position: absolute;
      bottom: 0; right: 22px;
      z-index: 4;
      width: 70px;
    }

    /* cabinet */
    .cabinet {
      position: absolute;
      top: 60px; left: 18px;
      z-index: 2;
      width: 54px;
    }

    /* cactus */
    .cactus {
      position: absolute;
      top: 32px; left: 22px;
      z-index: 2;
      width: 28px;
    }

    /* ── RIGHT: white form side ── */
    .right {
      width: 320px;
      flex-shrink: 0;
      background: var(--white);
      border-radius: 0 22px 22px 0;
      padding: 36px 32px 28px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 7px;
      margin-bottom: 22px;
    }

    .logo-icon {
      width: 22px; height: 22px;
      background: var(--green-btn);
      border-radius: 4px;
      position: relative;
      transform: rotate(-8deg);
    }

    .logo-icon::after {
      content: '';
      position: absolute;
      top: 4px; left: 5px;
      width: 12px; height: 3px;
      background: white;
      border-radius: 2px;
      box-shadow: 0 4px 0 white, 0 8px 0 white;
    }

    .logo-name {
      font-family: 'DM Sans', sans-serif;
      font-size: 15px;
      font-weight: 600;
      color: var(--black);
      letter-spacing: -0.2px;
    }

    h1 {
      font-family: 'DM Serif Display', serif;
      font-size: 38px;
      line-height: 1.1;
      color: var(--black);
      margin-bottom: 22px;
    }

    .form { display: flex; flex-direction: column; gap: 10px; }

    .input-wrap { position: relative; }

    .input-wrap input {
      width: 100%;
      padding: 13px 44px 13px 16px;
      border: 1.5px solid var(--input-border);
      border-radius: 12px;
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      color: var(--black);
      background: var(--input-bg);
      outline: none;
      transition: border-color 0.2s;
    }

    .input-wrap input::placeholder { color: #bbb; }
    .input-wrap input:focus { border-color: var(--green-btn); background: white; }

    .eye-btn {
      position: absolute;
      right: 14px; top: 50%;
      transform: translateY(-50%);
      background: none; border: none;
      cursor: pointer; color: #bbb;
      display: flex; align-items: center;
      transition: color 0.2s;
    }
    .eye-btn:hover { color: var(--black); }

    .btn-create {
      width: 100%;
      padding: 14px;
      border-radius: 50px;
      border: none;
      background: var(--green-btn);
      color: white;
      font-family: 'DM Sans', sans-serif;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 4px;
      transition: transform 0.15s, box-shadow 0.15s, background 0.2s;
    }
    .btn-create:hover { background: var(--green-dark); transform: translateY(-1px); box-shadow: 0 8px 24px rgba(76,175,80,0.35); }
    .btn-create:active { transform: translateY(0); }

    .divider {
      display: flex; align-items: center; gap: 10px;
      margin: 12px 0 10px;
      font-size: 12px; color: var(--gray);
    }
    .divider::before, .divider::after { content:''; flex:1; height:1px; background:#eee; }

    .socials { display: flex; justify-content: center; gap: 10px; }

    .s-btn {
      width: 40px; height: 40px;
      border-radius: 10px;
      border: 1.5px solid var(--input-border);
      background: white;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      transition: border-color 0.2s, transform 0.15s;
    }
    .s-btn:hover { border-color: var(--green-btn); transform: translateY(-2px); }
    .s-btn svg { width: 17px; height: 17px; }

    .terms {
      font-size: 11px;
      color: var(--gray);
      text-align: center;
      line-height: 1.6;
      margin-top: 10px;
    }
    .terms a { color: var(--green-btn); text-decoration: none; font-weight: 500; }
    .terms a:hover { text-decoration: underline; }

    .footer-txt {
      font-size: 12.5px;
      color: var(--gray);
      text-align: center;
      margin-top: 10px;
    }
    .footer-txt a { color: var(--green-btn); font-weight: 600; text-decoration: none; }
    .footer-txt a:hover { text-decoration: underline; }

    @media (max-width: 700px) {
      .shell { flex-direction: column; width: 96vw; height: auto; }
      .left  { min-height: 220px; border-radius: 22px 22px 0 0; }
      .right { width: 100%; border-radius: 0 0 22px 22px; }
    }
  </style>
</head>
<body>

<div class="shell">

  <!-- LEFT: illustration -->
  <div class="left">

    <!-- clock -->
    <div class="clock"></div>

    <!-- small cabinet SVG -->
    <svg class="cabinet" viewBox="0 0 54 80" xmlns="http://www.w3.org/2000/svg">
      <rect x="2" y="10" width="50" height="68" rx="4" fill="#f5f5f5"/>
      <rect x="2" y="10" width="50" height="34" rx="4" fill="#eeeeee"/>
      <rect x="2" y="10" width="50" height="4" fill="#e0e0e0"/>
      <rect x="2" y="44" width="50" height="4" fill="#e0e0e0"/>
      <circle cx="27" cy="29" r="3" fill="#bdbdbd"/>
      <circle cx="27" cy="63" r="3" fill="#bdbdbd"/>
      <!-- cactus on top -->
      <rect x="18" y="0" width="6" height="14" rx="3" fill="#66bb6a"/>
      <rect x="10" y="4" width="10" height="4" rx="2" fill="#66bb6a"/>
      <rect x="24" y="6" width="8" height="4" rx="2" fill="#66bb6a"/>
    </svg>

    <!-- 3D character SVG (hand-crafted illustration style) -->
    <svg class="character" viewBox="0 0 230 300" xmlns="http://www.w3.org/2000/svg">
      <!-- desk -->
      <rect x="18" y="190" width="194" height="12" rx="4" fill="#4e342e"/>
      <rect x="28" y="202" width="8" height="60" rx="3" fill="#4e342e"/>
      <rect x="194" y="202" width="8" height="60" rx="3" fill="#4e342e"/>
      <!-- desk surface highlight -->
      <rect x="18" y="190" width="194" height="5" rx="4" fill="#6d4c41"/>

      <!-- laptop -->
      <rect x="70" y="158" width="90" height="58" rx="5" fill="#455a64"/>
      <rect x="74" y="162" width="82" height="50" rx="3" fill="#78909c"/>
      <!-- screen glow -->
      <rect x="76" y="164" width="78" height="46" rx="2" fill="#b2dfdb" opacity="0.6"/>
      <rect x="56" y="213" width="118" height="6" rx="3" fill="#37474f"/>

      <!-- chair -->
      <rect x="80" y="230" width="70" height="10" rx="5" fill="#9e9e9e"/>
      <rect x="105" y="240" width="20" height="40" rx="4" fill="#9e9e9e"/>
      <rect x="80" y="246" width="20" height="8" rx="4" fill="#bdbdbd"/>
      <rect x="130" y="246" width="20" height="8" rx="4" fill="#bdbdbd"/>
      <ellipse cx="115" cy="282" rx="22" ry="8" fill="#757575"/>

      <!-- body / green sweater -->
      <ellipse cx="115" cy="195" rx="38" ry="28" fill="#4caf50"/>
      <!-- collar -->
      <path d="M102 170 q13-8 26 0" fill="#388e3c"/>

      <!-- left arm on desk -->
      <path d="M78 185 q-20 10-22 28" stroke="#4caf50" stroke-width="20" fill="none" stroke-linecap="round"/>
      <ellipse cx="56" cy="213" rx="12" ry="9" fill="#f5c5a3" transform="rotate(-10 56 213)"/>

      <!-- right arm -->
      <path d="M152 185 q18 8 20 26" stroke="#4caf50" stroke-width="20" fill="none" stroke-linecap="round"/>
      <ellipse cx="172" cy="211" rx="11" ry="9" fill="#f5c5a3" transform="rotate(10 172 211)"/>

      <!-- fingers on keyboard -->
      <ellipse cx="100" cy="216" rx="5" ry="3" fill="#f5c5a3"/>
      <ellipse cx="112" cy="216" rx="5" ry="3" fill="#f5c5a3"/>
      <ellipse cx="124" cy="216" rx="5" ry="3" fill="#f5c5a3"/>

      <!-- neck -->
      <rect x="107" y="155" width="16" height="18" rx="6" fill="#f5c5a3"/>

      <!-- head -->
      <ellipse cx="115" cy="135" rx="30" ry="32" fill="#f5c5a3"/>

      <!-- hair -->
      <ellipse cx="115" cy="108" rx="30" ry="16" fill="#5d4037"/>
      <ellipse cx="90"  cy="118" rx="10" ry="18" fill="#5d4037"/>
      <ellipse cx="140" cy="118" rx="10" ry="18" fill="#5d4037"/>
      <ellipse cx="115" cy="106" rx="28" ry="12" fill="#6d4c41"/>

      <!-- glasses -->
      <rect x="96" y="130" width="16" height="11" rx="5" fill="none" stroke="#5d4037" stroke-width="2.5"/>
      <rect x="118" y="130" width="16" height="11" rx="5" fill="none" stroke="#5d4037" stroke-width="2.5"/>
      <line x1="112" y1="135" x2="118" y2="135" stroke="#5d4037" stroke-width="2"/>
      <line x1="88"  y1="135" x2="96"  y2="135" stroke="#5d4037" stroke-width="2"/>
      <line x1="134" y1="135" x2="142" y2="135" stroke="#5d4037" stroke-width="2"/>

      <!-- eyes behind glasses -->
      <circle cx="104" cy="135" r="3" fill="#5d4037"/>
      <circle cx="126" cy="135" r="3" fill="#5d4037"/>
      <circle cx="105" cy="134" r="1" fill="white"/>
      <circle cx="127" cy="134" r="1" fill="white"/>

      <!-- beard -->
      <path d="M92 152 q23 14 46 0 q-10 20-23 22 q-13-2-23-22z" fill="#5d4037"/>

      <!-- mug -->
      <rect x="164" y="198" width="22" height="18" rx="4" fill="#1565c0"/>
      <path d="M186 204 q8 0 8 6 q0 6-8 6" fill="none" stroke="#1565c0" stroke-width="3" stroke-linecap="round"/>
      <rect x="166" y="200" width="18" height="4" rx="2" fill="#1976d2"/>

      <!-- notebook -->
      <rect x="42" y="188" width="30" height="20" rx="3" fill="#fff9c4" transform="rotate(-5 42 188)"/>
      <line x1="47" y1="196" x2="68" y2="193" stroke="#f9a825" stroke-width="1.5"/>
      <line x1="47" y1="200" x2="68" y2="197" stroke="#f9a825" stroke-width="1.5"/>
    </svg>

    <!-- plant SVG -->
    <svg class="plant" viewBox="0 0 70 130" xmlns="http://www.w3.org/2000/svg">
      <!-- pot -->
      <path d="M18 90 l4 38 h26 l4-38z" fill="#9e9e9e"/>
      <ellipse cx="35" cy="90" rx="18" ry="7" fill="#bdbdbd"/>
      <!-- soil -->
      <ellipse cx="35" cy="90" rx="16" ry="5" fill="#5d4037"/>
      <!-- stem -->
      <path d="M35 90 q-2-30 0-60" stroke="#388e3c" stroke-width="4" fill="none" stroke-linecap="round"/>
      <!-- leaves -->
      <path d="M35 60 q-30-10-28 10 q10-5 28-10z" fill="#4caf50"/>
      <path d="M35 60 q30-10 28 10 q-10-5-28-10z" fill="#66bb6a"/>
      <path d="M33 40 q-24-8-20 12 q8-8 20-12z" fill="#4caf50"/>
      <path d="M37 40 q24-8 20 12 q-8-8-20-12z" fill="#66bb6a"/>
      <path d="M34 20 q-18-6-14 10 q6-6 14-10z" fill="#4caf50"/>
      <path d="M36 20 q18-6 14 10 q-6-6-14-10z" fill="#66bb6a"/>
    </svg>

  </div>

  <!-- RIGHT: form -->
  <div class="right">
    <div>
      <!-- logo -->
      <div class="logo">
        <div class="logo-icon"></div>
        <span class="logo-name">messimo</span>
      </div>

      <h1>Create<br>account</h1>

      <!-- ✅ form with name attributes for backend -->
      <form class="form" method="post" action="/signup">
        <div class="input-wrap">
          <input name="username" type="text" placeholder="Username" required autocomplete="off"/>
        </div>
        <div class="input-wrap">
          <input name="password" type="password" id="pwd" placeholder="Password" required/>
          <button type="button" class="eye-btn" onclick="togglePwd()" aria-label="Toggle password">
            <svg id="eye-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
        <button type="submit" class="btn-create">Create account</button>
      </form>

      <div class="divider">or sign up with</div>

      <div class="socials">
        <!-- Google -->
        <button class="s-btn" type="button" aria-label="Google">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
            <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
            <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
            <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
          </svg>
        </button>
        <!-- Windows/Grid icon -->
        <button class="s-btn" type="button" aria-label="Microsoft">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <rect x="1"  y="1"  width="10" height="10" fill="#f25022"/>
            <rect x="13" y="1"  width="10" height="10" fill="#7fba00"/>
            <rect x="1"  y="13" width="10" height="10" fill="#00a4ef"/>
            <rect x="13" y="13" width="10" height="10" fill="#ffb900"/>
          </svg>
        </button>
        <!-- GitHub -->
        <button class="s-btn" type="button" aria-label="GitHub">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path fill="#333" d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"/>
          </svg>
        </button>
      </div>

      <p class="terms">By creating an account you agree to Messimo's<br>
        <a href="#">Terms of Services</a> and <a href="#">Privacy Policy.</a>
      </p>
    </div>

    <p class="footer-txt">Have an account? <a href="/login">Log in</a></p>
  </div>

</div>

<script>
  function togglePwd() {
    const input = document.getElementById('pwd');
    const icon  = document.getElementById('eye-icon');
    if (input.type === 'password') {
      input.type = 'text';
      icon.innerHTML = `<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/>`;
    } else {
      input.type = 'password';
      icon.innerHTML = `<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>`;
    }
  }
</script>

</body>
</html>
